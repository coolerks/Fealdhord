# 本机开发配置；不包含密钥或绝对开发机路径。
version: '3'
info:
  companyName: Fealdhord
  productName: Fealdhord
  productIdentifier: io.fealdhord.desktop
  description: 本地优先的 RSS 阅读器
  version: 0.1.0

dev_mode:
  root_path: .
  log_level: warn
  debounce: 1000
  ignore:
    dir: [.git, .trellis, .agents, .claude, .codex, .pi, docs, frontend, node_modules, bin]
    file: ['*_test.go', .DS_Store]
    watched_extension: ['*.go']
    git_ignore: true
  executes:
    - cmd: wails3 build DEV=true OUTPUT_DIR=bin/dev
      type: blocking
    # Wails 根据 FRONTEND_DEVSERVER_URL 自动等待标准前端任务就绪。
    - cmd: wails3 task common:dev:frontend
      type: background
    - cmd: wails3 task run OUTPUT_DIR=bin/dev
      type: primary
      exit_policy: shutdown
