version: '3'

vars:
  APP_NAME: Fealdhord

tasks:
  bindings:
    summary: 生成固定 Wails 版本的 TypeScript 绑定
    cmds:
      - >-
        node -e "const fs = require('node:fs'); fs.mkdirSync('frontend/dist', { recursive: true }); fs.writeFileSync('frontend/dist/.gitkeep', '')"
      - wails3 generate bindings -ts -i

  frontend:
    summary: 构建前端静态资源
    dir: frontend
    cmds:
      - npm run build

  build:
    summary: 构建当前平台桌面应用
    cmds:
      - task: bindings
      - task: frontend
      - go build {{if ne .DEV "true"}}-tags production{{end}} -o bin/{{.APP_NAME}}{{exeExt}} .
    env:
      MACOSX_DEPLOYMENT_TARGET: '{{if eq OS "darwin"}}13.0{{end}}'
      CGO_CFLAGS: '{{if eq OS "darwin"}}-mmacosx-version-min=13.0{{end}}'
      CGO_LDFLAGS: '{{if eq OS "darwin"}}-mmacosx-version-min=13.0{{end}}'


  run:
    summary: 运行已构建的桌面应用
    cmds:
      - task: '{{if eq OS "darwin"}}run:mac{{else}}run:binary{{end}}'

  bundle:mac:
    summary: 创建本机调试用 macOS 应用包，不代表发布签名
    platforms: [darwin]
    cmds:
      - mkdir -p bin/{{.APP_NAME}}.app/Contents/MacOS
      - cp bin/{{.APP_NAME}} bin/{{.APP_NAME}}.app/Contents/MacOS/{{.APP_NAME}}
      - cp build/darwin/Info.plist bin/{{.APP_NAME}}.app/Contents/Info.plist
      - codesign --force --deep --sign - bin/{{.APP_NAME}}.app
      - codesign --verify --deep --strict bin/{{.APP_NAME}}.app

  run:mac:
    internal: true
    cmds:
      - task: bundle:mac
      - ./bin/{{.APP_NAME}}.app/Contents/MacOS/{{.APP_NAME}}

  run:binary:
    internal: true
    cmds:
      - ./bin/{{.APP_NAME}}{{exeExt}}

  dev:
    summary: 启动桌面应用与前端热更新
    cmds:
      - wails3 dev -config ./build/config.yml -port 9245

  dev:frontend:
    summary: 启动前端开发服务器
    dir: frontend
    cmds:
      - npm run dev

  check:
    summary: 执行 Go 与前端质量检查
    cmds:
      - go test ./...
      - go vet ./...
      - task: frontend:check

  frontend:check:
    summary: 在前端目录运行类型、lint 与交互测试
    dir: frontend
    cmds:
      - npm run typecheck
      - npm run lint
      - npm test
