version: '3'

vars:
  APP_NAME: Fealdhord
  OUTPUT_DIR: bin/local

tasks:
  bindings:
    summary: 生成固定 Wails 版本的 TypeScript 绑定
    cmds:
      - >-
        node -e "const fs = require('node:fs'); fs.mkdirSync('frontend/dist', { recursive: true }); fs.writeFileSync('frontend/dist/.gitkeep', '')"
      - wails3 generate bindings -ts -i

  frontend:
    summary: 构建前端静态资源
    dir: frontend
    cmds:
      - npm run build

  icons:
    summary: 从应用 PNG 生成 macOS 和 Windows 图标
    cmds:
      - mkdir -p bin/icons
      - wails3 generate icons -input build/appicon.png -macfilename bin/icons/Fealdhord.icns -windowsfilename bin/icons/Fealdhord.ico

  build:
    summary: 构建当前平台桌面应用
    cmds:
      - task: bindings
      - task: frontend
      - task: resources:windows
      - go build {{if ne .DEV "true"}}-tags production{{end}} -o {{.OUTPUT_DIR}}/{{.APP_NAME}}{{exeExt}} .
    env:
      MACOSX_DEPLOYMENT_TARGET: '{{if eq OS "darwin"}}13.0{{end}}'
      CGO_CFLAGS: '{{if eq OS "darwin"}}-mmacosx-version-min=13.0{{end}}'
      CGO_LDFLAGS: '{{if eq OS "darwin"}}-mmacosx-version-min=13.0{{end}}'

  resources:windows:
    summary: 为本机 Windows 构建更新应用图标资源
    platforms: [windows]
    cmds:
      - task: icons
      - wails3 generate syso -arch {{ARCH}} -icon bin/icons/Fealdhord.ico -manifest build/windows/Fealdhord.exe.manifest -out rsrc_windows_{{ARCH}}.syso


  run:
    summary: 运行已构建的桌面应用
    cmds:
      - task: '{{if eq OS "darwin"}}run:mac{{else}}run:binary{{end}}'
        vars:
          OUTPUT_DIR: '{{.OUTPUT_DIR}}'

  bundle:mac:
    summary: 创建本机调试用 macOS 应用包，不代表发布签名
    platforms: [darwin]
    cmds:
      - task: icons
      - mkdir -p {{.OUTPUT_DIR}}/{{.APP_NAME}}.app/Contents/MacOS {{.OUTPUT_DIR}}/{{.APP_NAME}}.app/Contents/Resources
      - cp bin/icons/Fealdhord.icns {{.OUTPUT_DIR}}/{{.APP_NAME}}.app/Contents/Resources/Fealdhord.icns
      # 替换已签名可执行文件时使用新 inode，避免原位覆盖后的签名缓存失效。
      - rm -f {{.OUTPUT_DIR}}/{{.APP_NAME}}.app/Contents/MacOS/{{.APP_NAME}}
      - cp {{.OUTPUT_DIR}}/{{.APP_NAME}} {{.OUTPUT_DIR}}/{{.APP_NAME}}.app/Contents/MacOS/{{.APP_NAME}}
      - cp build/darwin/Info.plist {{.OUTPUT_DIR}}/{{.APP_NAME}}.app/Contents/Info.plist
      - codesign --force --deep --sign - {{.OUTPUT_DIR}}/{{.APP_NAME}}.app
      - codesign --verify --deep --strict {{.OUTPUT_DIR}}/{{.APP_NAME}}.app

  run:mac:
    internal: true
    cmds:
      - task: bundle:mac
        vars:
          OUTPUT_DIR: '{{.OUTPUT_DIR}}'
      - ./{{.OUTPUT_DIR}}/{{.APP_NAME}}.app/Contents/MacOS/{{.APP_NAME}}

  run:binary:
    internal: true
    cmds:
      - ./{{.OUTPUT_DIR}}/{{.APP_NAME}}{{exeExt}}

  dev:
    summary: 启动桌面应用与前端热更新
    cmds:
      - wails3 dev -config ./build/config.yml

  common:dev:frontend:
    summary: 启动前端开发服务器
    dir: frontend
    cmds:
      - npm run dev

  check:
    summary: 执行 Go 与前端质量检查
    cmds:
      - go test ./...
      - go vet ./...
      - task: frontend:check

  frontend:check:
    summary: 在前端目录运行类型、lint 与交互测试
    dir: frontend
    cmds:
      - npm run typecheck
      - npm run lint
      - npm test
